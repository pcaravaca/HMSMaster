version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: env.production
    ports:
      - "55434:5432"
    volumes:
      - hms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hmsmaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8091:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file: env.production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3101:80"
    depends_on:
      - backend

volumes:
  hms_db_data:
